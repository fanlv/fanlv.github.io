<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI System Prompts Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 320px;
            background: #161b22;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #30363d;
        }

        .sidebar-header h1 {
            font-size: 18px;
            color: #58a6ff;
            margin-bottom: 12px;
        }

        .search-box {
            width: 100%;
            padding: 10px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 14px;
        }

        .search-box:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0;
        }

        .category {
            margin-bottom: 8px;
        }

        .category-header {
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 600;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-header:hover {
            color: #c9d1d9;
        }

        .category-header .arrow {
            transition: transform 0.2s;
        }

        .category.collapsed .arrow {
            transform: rotate(-90deg);
        }

        .category.collapsed .category-files {
            display: none;
        }

        .file-item {
            padding: 8px 20px 8px 32px;
            cursor: pointer;
            font-size: 14px;
            color: #8b949e;
            transition: all 0.15s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item:hover {
            background: #21262d;
            color: #c9d1d9;
        }

        .file-item.active {
            background: #1f6feb33;
            color: #58a6ff;
            border-left: 2px solid #58a6ff;
            padding-left: 30px;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            padding: 16px 24px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .content-header h2 {
            font-size: 16px;
            color: #c9d1d9;
            font-weight: 500;
        }

        .content-header .file-path {
            font-size: 12px;
            color: #8b949e;
            margin-top: 4px;
        }

        .content-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 6px 12px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn:hover {
            background: #30363d;
        }

        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .prompt-content {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            white-space: pre-wrap;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #c9d1d9;
            max-width: 100%;
            overflow-x: auto;
        }

        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #8b949e;
            text-align: center;
        }

        .welcome h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #c9d1d9;
        }

        .welcome p {
            font-size: 14px;
            max-width: 400px;
        }

        .stats {
            margin-top: 24px;
            display: flex;
            gap: 24px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 600;
            color: #58a6ff;
        }

        .stat-label {
            font-size: 12px;
            color: #8b949e;
            margin-top: 4px;
        }

        .hidden {
            display: none !important;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0d1117;
        }

        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: 40vh;
            }

            .content {
                height: 60vh;
            }
        }
    </style>
</head>
<body>

        <div class="sidebar">
            <div class="sidebar-header">
                <h1>🤖 AI System Prompts</h1>
                <input type="text" class="search-box" placeholder="搜索文件..." id="searchInput">
            </div>
            <div class="file-list" id="fileList"></div>
        </div>
        <div class="content">
            <div class="content-header" id="contentHeader" style="display: none;">
                <div>
                    <h2 id="fileName"></h2>
                    <div class="file-path" id="filePath"></div>
                </div>
                <div class="content-actions">
                    <button class="btn" onclick="copyContent()">📋 复制</button>
                    <button class="btn" onclick="toggleWrap()">↔️ 换行</button>
                </div>
            </div>
            <div class="content-body">
                <div class="welcome" id="welcome">
                    <h2>欢迎使用 Prompt 浏览器</h2>
                    <p>从左侧列表选择一个文件来查看其内容。这里收集了各种 AI 工具的系统提示词。</p>
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-value" id="totalCategories">0</div>
                            <div class="stat-label">分类</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="totalFiles">0</div>
                            <div class="stat-label">文件</div>
                        </div>
                    </div>
                </div>
                <pre class="prompt-content hidden" id="promptContent"></pre>
            </div>
        </div>
    </div>

        let currentFile = null;
        let wrapEnabled = true;

        function init() {
            renderFileList();
            updateStats();
            document.getElementById('searchInput').addEventListener('input', handleSearch);
        }

        function renderFileList(filter = '') {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';

            const sortedCategories = Object.keys(files).sort();

            for (const category of sortedCategories) {
                const categoryFiles = files[category].filter(file => 
                    filter === '' || 
                    file.name.toLowerCase().includes(filter.toLowerCase()) ||
                    category.toLowerCase().includes(filter.toLowerCase())
                );

                if (categoryFiles.length === 0) continue;

                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';

                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerHTML = `<span class="arrow">▼</span> ${category} (${categoryFiles.length})`;
                header.onclick = () => categoryDiv.classList.toggle('collapsed');

                const filesDiv = document.createElement('div');
                filesDiv.className = 'category-files';

                for (const file of categoryFiles) {
                    const fileDiv = document.createElement('div');
                    fileDiv.className = 'file-item';
                    fileDiv.textContent = file.name;
                    fileDiv.onclick = () => loadFile(file.path, file.name, category);
                    fileDiv.dataset.path = file.path;
                    filesDiv.appendChild(fileDiv);
                }

                categoryDiv.appendChild(header);
                categoryDiv.appendChild(filesDiv);
                fileList.appendChild(categoryDiv);
            }
        }

        function handleSearch(e) {
            renderFileList(e.target.value);
        }

        async function loadFile(path, name, category) {
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`[data-path="${path}"]`)?.classList.add('active');

            document.getElementById('welcome').classList.add('hidden');
            document.getElementById('promptContent').classList.remove('hidden');
            document.getElementById('contentHeader').style.display = 'flex';
            document.getElementById('fileName').textContent = `${category} / ${name}`;
            document.getElementById('filePath').textContent = path;

            try {
                const response = await fetch(path);
                if (!response.ok) throw new Error('File not found');
                const content = await response.text();
                document.getElementById('promptContent').textContent = content;
                currentFile = { path, name, content };
            } catch (error) {
                document.getElementById('promptContent').textContent = `无法加载文件: ${error.message}\n\n请确保在本地服务器环境下运行此页面。\n\n可以使用以下命令启动本地服务器:\n  python -m http.server 8000\n  或\n  npx serve`;
            }
        }

        function copyContent() {
            if (currentFile) {
                navigator.clipboard.writeText(currentFile.content).then(() => {
                    alert('已复制到剪贴板');
                });
            }
        }

        function toggleWrap() {
            const content = document.getElementById('promptContent');
            wrapEnabled = !wrapEnabled;
            content.style.whiteSpace = wrapEnabled ? 'pre-wrap' : 'pre';
        }

        function updateStats() {
            const categories = Object.keys(files).length;
            const totalFiles = Object.values(files).reduce((sum, arr) => sum + arr.length, 0);
            document.getElementById('totalCategories').textContent = categories;
            document.getElementById('totalFiles').textContent = totalFiles;
        }

        init();
