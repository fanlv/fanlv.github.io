<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI System Prompts Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 320px;
            background: #161b22;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #30363d;
        }

        .sidebar-header h1 {
            font-size: 18px;
            color: #58a6ff;
            margin-bottom: 12px;
        }

        .search-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-box {
            width: 100%;
            padding: 10px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 14px;
        }

        .search-box:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .search-mode-toggle {
            display: flex;
            gap: 4px;
        }

        .search-mode-btn {
            flex: 1;
            padding: 6px 10px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #8b949e;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .search-mode-btn:hover {
            background: #30363d;
            color: #c9d1d9;
        }

        .search-mode-btn.active {
            background: #1f6feb;
            border-color: #1f6feb;
            color: #fff;
        }

        .search-status {
            font-size: 11px;
            color: #8b949e;
            padding: 4px 0;
        }

        .search-status.loading {
            color: #f0883e;
        }

        .search-status.ready {
            color: #3fb950;
        }

        .search-result-item {
            padding: 10px 20px 10px 32px;
            cursor: pointer;
            font-size: 13px;
            color: #8b949e;
            transition: all 0.15s;
            border-bottom: 1px solid #21262d;
        }

        .search-result-item:hover {
            background: #21262d;
            color: #c9d1d9;
        }

        .search-result-item .result-title {
            color: #58a6ff;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .search-result-item .result-path {
            color: #8b949e;
            font-size: 11px;
            margin-bottom: 6px;
        }

        .search-result-item .result-preview {
            font-size: 12px;
            color: #c9d1d9;
            background: #0d1117;
            padding: 8px;
            border-radius: 4px;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 80px;
            overflow: hidden;
        }

        .search-result-item .result-preview .highlight {
            background: #f0883e;
            color: #0d1117;
            padding: 1px 2px;
            border-radius: 2px;
        }

        .search-results-header {
            padding: 8px 20px;
            font-size: 12px;
            color: #8b949e;
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }

        .prompt-content .highlight {
            background: #f0883e;
            color: #0d1117;
            padding: 1px 2px;
            border-radius: 2px;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0;
        }

        .category {
            margin-bottom: 8px;
        }

        .category-header {
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 600;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-header:hover {
            color: #c9d1d9;
        }

        .category-header .arrow {
            transition: transform 0.2s;
        }

        .category.collapsed .arrow {
            transform: rotate(-90deg);
        }

        .category.collapsed .category-files {
            display: none;
        }

        .file-item {
            padding: 8px 20px 8px 32px;
            cursor: pointer;
            font-size: 14px;
            color: #8b949e;
            transition: all 0.15s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item:hover {
            background: #21262d;
            color: #c9d1d9;
        }

        .file-item.active {
            background: #1f6feb33;
            color: #58a6ff;
            border-left: 2px solid #58a6ff;
            padding-left: 30px;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            padding: 16px 24px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .content-header h2 {
            font-size: 16px;
            color: #c9d1d9;
            font-weight: 500;
        }

        .content-header .file-path {
            font-size: 12px;
            color: #8b949e;
            margin-top: 4px;
        }

        .content-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 6px 12px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn:hover {
            background: #30363d;
        }

        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .prompt-content {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            white-space: pre-wrap;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #c9d1d9;
            max-width: 100%;
            overflow-x: auto;
        }

        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #8b949e;
            text-align: center;
        }

        .welcome h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #c9d1d9;
        }

        .welcome p {
            font-size: 14px;
            max-width: 400px;
        }

        .stats {
            margin-top: 24px;
            display: flex;
            gap: 24px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 600;
            color: #58a6ff;
        }

        .stat-label {
            font-size: 12px;
            color: #8b949e;
            margin-top: 4px;
        }

        .hidden {
            display: none !important;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0d1117;
        }

        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: 40vh;
            }

            .content {
                height: 60vh;
            }
        }
    </style>
</head>

            <div class="content-body">

                            <div class="stat-label">文件</div>
                        </div>
                    </div>
                </div>
                <pre class="prompt-content hidden" id="promptContent"></pre>
            </div>
        </div>
    </div>

        function init() {
            renderFileList();
            updateStats();
            document.getElementById('searchInput').addEventListener('input', handleSearch);
            buildContentIndex();
            loadFromHash();
            window.addEventListener('hashchange', loadFromHash);
        }

        function loadFromHash() {
            const hash = decodeURIComponent(window.location.hash.slice(1));
            if (!hash) return;

            for (const category of Object.keys(files)) {
                for (const file of files[category]) {
                    if (file.path === hash) {
                        loadFile(file.path, file.name, category);
                        return;
                    }
                }
            }
        }

        function updateHash(path) {
            const newHash = '#' + encodeURIComponent(path);
            if (window.location.hash !== newHash) {
                history.pushState(null, '', newHash);
            }
        }

        async function buildContentIndex() {
            const statusEl = document.getElementById('searchStatus');
            statusEl.className = 'search-status loading';
            statusEl.textContent = '正在建立搜索索引...';

            const allFiles = [];
            for (const category of Object.keys(files)) {
                for (const file of files[category]) {
                    allFiles.push({ ...file, category });
                }
            }

            let loaded = 0;
            const total = allFiles.length;

            for (const file of allFiles) {
                try {
                    const response = await fetch(file.path);
                    if (response.ok) {
                        const content = await response.text();
                        contentIndex[file.path] = {
                            content: content,
                            contentLower: content.toLowerCase(),
                            name: file.name,
                            category: file.category,
                            path: file.path
                        };
                    }
                } catch (e) {
                    console.warn(`Failed to load ${file.path}:`, e);
                }
                loaded++;
                statusEl.textContent = `正在建立索引... (${loaded}/${total})`;
            }

            indexReady = true;
            statusEl.className = 'search-status ready';
            statusEl.textContent = `✓ 索引就绪 (${Object.keys(contentIndex).length} 个文件)`;
            
            setTimeout(() => {
                statusEl.textContent = '';
            }, 3000);
        }

        function setSearchMode(mode) {
            searchMode = mode;
            document.getElementById('fileSearchBtn').classList.toggle('active', mode === 'file');
            document.getElementById('contentSearchBtn').classList.toggle('active', mode === 'content');
            
            const searchInput = document.getElementById('searchInput');
            searchInput.placeholder = mode === 'file' ? '搜索文件名...' : '搜索内容...';
            
            if (searchInput.value) {
                handleSearch({ target: searchInput });
            }
        }

        function renderFileList(filter = '') {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';

            const sortedCategories = Object.keys(files).sort();

            for (const category of sortedCategories) {
                const categoryFiles = files[category].filter(file => 
                    filter === '' || 
                    file.name.toLowerCase().includes(filter.toLowerCase()) ||
                    category.toLowerCase().includes(filter.toLowerCase())
                );

                if (categoryFiles.length === 0) continue;

                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';

                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerHTML = `<span class="arrow">▼</span> ${category} (${categoryFiles.length})`;
                header.onclick = () => categoryDiv.classList.toggle('collapsed');

                const filesDiv = document.createElement('div');
                filesDiv.className = 'category-files';

                for (const file of categoryFiles) {
                    const fileDiv = document.createElement('div');
                    fileDiv.className = 'file-item';
                    fileDiv.textContent = file.name;
                    fileDiv.onclick = () => loadFile(file.path, file.name, category);
                    fileDiv.dataset.path = file.path;
                    filesDiv.appendChild(fileDiv);
                }

                categoryDiv.appendChild(header);
                categoryDiv.appendChild(filesDiv);
                fileList.appendChild(categoryDiv);
            }
        }

        function handleSearch(e) {
            const query = e.target.value.trim();
            currentSearchTerm = query;
            
            if (searchMode === 'file') {
                renderFileList(query);
            } else {
                renderContentSearchResults(query);
            }
        }

        function renderContentSearchResults(query) {
            const fileList = document.getElementById('fileList');
            
            if (!query) {
                renderFileList('');
                return;
            }

            if (!indexReady) {
                fileList.innerHTML = '<div class="search-results-header">索引尚未就绪，请稍候...</div>';
                return;
            }

            const queryLower = query.toLowerCase();
            const results = [];

            for (const path in contentIndex) {
                const file = contentIndex[path];
                const index = file.contentLower.indexOf(queryLower);
                
                if (index !== -1) {
                    const start = Math.max(0, index - 50);
                    const end = Math.min(file.content.length, index + query.length + 100);
                    let preview = file.content.substring(start, end);
                    
                    if (start > 0) preview = '...' + preview;
                    if (end < file.content.length) preview = preview + '...';
                    
                    const matchCount = (file.contentLower.match(new RegExp(escapeRegExp(queryLower), 'g')) || []).length;
                    
                    results.push({
                        ...file,
                        preview,
                        matchIndex: index,
                        matchCount
                    });
                }
            }

            results.sort((a, b) => b.matchCount - a.matchCount);

            fileList.innerHTML = '';

            if (results.length === 0) {
                fileList.innerHTML = '<div class="search-results-header">未找到匹配结果</div>';
                return;
            }

            const header = document.createElement('div');
            header.className = 'search-results-header';
            header.textContent = `找到 ${results.length} 个匹配文件`;
            fileList.appendChild(header);

            for (const result of results) {
                const item = document.createElement('div');
                item.className = 'search-result-item';
                
                const highlightedPreview = highlightText(result.preview, query);
                
                item.innerHTML = `
                    <div class="result-title">${result.category} / ${result.name}</div>
                    <div class="result-path">${result.path} (${result.matchCount} 处匹配)</div>
                    <div class="result-preview">${highlightedPreview}</div>
                `;
                
                item.onclick = () => loadFileWithHighlight(result.path, result.name, result.category, query);
                fileList.appendChild(item);
            }
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function highlightText(text, query) {
            if (!query) return escapeHtml(text);
            
            const escaped = escapeHtml(text);
            const queryEscaped = escapeHtml(query);
            const regex = new RegExp(`(${escapeRegExp(queryEscaped)})`, 'gi');
            return escaped.replace(regex, '<span class="highlight">$1</span>');
        }

        async function loadFileWithHighlight(path, name, category, searchTerm) {
            await loadFile(path, name, category);
            
            if (searchTerm && currentFile) {
                const contentEl = document.getElementById('promptContent');
                const highlightedContent = highlightText(currentFile.content, searchTerm);
                contentEl.innerHTML = highlightedContent;
                
                setTimeout(() => {
                    const firstHighlight = contentEl.querySelector('.highlight');
                    if (firstHighlight) {
                        firstHighlight.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }

        async function loadFile(path, name, category) {
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`[data-path="${path}"]`)?.classList.add('active');

            document.getElementById('welcome').classList.add('hidden');
            document.getElementById('promptContent').classList.remove('hidden');
            document.getElementById('contentHeader').style.display = 'flex';
            document.getElementById('fileName').textContent = `${category} / ${name}`;
            document.getElementById('filePath').textContent = path;

            updateHash(path);

            try {
                const response = await fetch(path);
                if (!response.ok) throw new Error('File not found');
                const content = await response.text();
                document.getElementById('promptContent').textContent = content;
                currentFile = { path, name, category, content };
            } catch (error) {
                document.getElementById('promptContent').textContent = `无法加载文件: ${error.message}\n\n请确保在本地服务器环境下运行此页面。\n\n可以使用以下命令启动本地服务器:\n  python -m http.server 8000\n  或\n  npx serve`;
            }
        }

        function copyContent() {
            if (currentFile) {
                navigator.clipboard.writeText(currentFile.content).then(() => {
                    alert('已复制到剪贴板');
                });
            }
        }

        function copyShareLink() {
            if (currentFile) {
                const url = window.location.origin + window.location.pathname + '#' + encodeURIComponent(currentFile.path);
                navigator.clipboard.writeText(url).then(() => {
                    alert('链接已复制到剪贴板');
                });
            }
        }

        function toggleWrap() {
            const content = document.getElementById('promptContent');
            wrapEnabled = !wrapEnabled;
            content.style.whiteSpace = wrapEnabled ? 'pre-wrap' : 'pre';
        }

        function updateStats() {
            const categories = Object.keys(files).length;
            const totalFiles = Object.values(files).reduce((sum, arr) => sum + arr.length, 0);
            document.getElementById('totalCategories').textContent = categories;
            document.getElementById('totalFiles').textContent = totalFiles;
        }

        init();
    </script>
</body>
</html>
